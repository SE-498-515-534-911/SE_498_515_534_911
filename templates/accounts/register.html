{% extends "base.html" %}
{% block title %}Register - WBMME{% endblock %}
{% block content %}
<h1>Create an account</h1>
<form method="post" novalidate>
  {% csrf_token %}
  {{ form.as_p }}
  <button type="submit">Register</button>
</form>
<p>Already registered? <a href="{% url 'accounts:login' %}">Log in</a></p>
{% endblock %}
