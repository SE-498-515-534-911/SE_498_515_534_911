{% extends "base.html" %}
{% block title %}Log in - WBMME{% endblock %}
{% block content %}
<h1>Log in</h1>
<form method="post" novalidate>
  {% csrf_token %}
  {{ form.as_p }}
  <input type="hidden" name="next" value="{{ next }}">
  <button type="submit">Log in</button>
</form>
<p>No account yet? <a href="{% url 'accounts:register' %}">Register</a></p>
{% endblock %}
