
name: OWASP ZAP Baseline Scan

on:
  push:
    branches:
      - main
      - "feature/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  zap-baseline:
    name: ZAP Baseline Scan
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build and start WBMME
        run: docker compose up --build -d

      - name: Wait for WBMME to respond
        run: |
          for attempt in $(seq 1 30); do
            if curl --silent --output /dev/null http://localhost:8000/; then
              echo "WBMME is responding."
              exit 0
            fi
            echo "Waiting for WBMME ($attempt/30)..."
            sleep 5
          done
          echo "WBMME did not become reachable."
          docker compose logs
          exit 1

      - name: Run OWASP ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.15.0
        with:
          target: "http://localhost:8000/"
          artifact_name: zap-baseline-report
          allow_issue_writing: false
          fail_action: false

      - name: Show container logs
        if: always()
        run: docker compose logs

      - name: Stop WBMME
        if: always()
        run: docker compose down
