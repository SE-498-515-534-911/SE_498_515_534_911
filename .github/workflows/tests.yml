
name: CI - Tests and Coverage

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    name: pytest
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install testing tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest pytest-cov pytest-django

      - name: Run main project tests
        run: |
          python -m pytest --ignore=us01_datasets_code --cov=. --cov-report=term-missing

      - name: Run US-01 dataset tests
        working-directory: us01_datasets_code
        run: |
          python -m pytest --ds=test_settings datasets/tests/
